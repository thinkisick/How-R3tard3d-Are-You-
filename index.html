<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>How R3tard3d Are You?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating Faces -->
  <div class="faces-container" id="facesContainer"></div>

  <!-- Touch Popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-face" id="popupFace"></div>
      <span>Do not touch it r3tard</span>
      <button onclick="closePopup()">ok</button>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen" id="homeScreen">
    <div class="hero">
      <img src="mainwebsite.png" class="hero-avatar" alt="">
      <h1 class="title">How R3tard3d<br/>Are You?</h1>
      <p class="subtitle">Enter your Twitter handle to find out</p>
      <div class="input-row">
        <input
          type="text"
          id="handleInput"
          class="handle-input"
          placeholder="@yourhandle"
          autocomplete="off"
          spellcheck="false"
          maxlength="50"
        />
        <button class="btn-rate" id="rateBtn" onclick="rateHandle()">
          <img src="face.png" class="btn-face-icon" alt="">
          Rate me
        </button>
      </div>
      <p class="input-hint">No login required · 100% vibes-based</p>

      <!-- Scanning state -->
      <div class="scanning-block hidden" id="scanningBlock">
        <img src="face.png" class="scanning-face" id="scanningFace" alt="">
        <p class="scanning-text">Scanning your r3tard3d energy...</p>
        <div class="scanning-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen hidden" id="resultScreen">
    <div class="result-card" id="resultCard">
      <div class="result-header">
        <div class="result-avatar" id="resultAvatar"></div>
        <div class="result-handle-name" id="resultHandle"></div>
      </div>

      <div class="score-block">
        <p class="score-label-top">R3tard3d Score</p>
        <div class="score-big" id="scoreBig"></div>
        <p class="score-tier" id="scoreTier"></p>
        <p class="score-desc" id="scoreDesc"></p>
      </div>

      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="share-buttons">
      <button class="btn-share btn-download" onclick="downloadCard()">⬇ Download Card</button>
      <button class="btn-share btn-twitter" onclick="shareTwitter()">𝕏 Share on Twitter</button>
      <button class="btn-share btn-copy" onclick="copyResult()">📋 Copy</button>
    </div>
    <button class="btn-retry" onclick="goHome()">← Try Another Handle</button>
    <p class="disclaimer">
      Not affiliated with X / Twitter or <a href="https://x.com/r3tardsNFT" target="_blank" rel="noopener">@r3tards</a> · For entertainment only
    </p>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>Made by <a href="https://x.com/thinkisick" target="_blank" rel="noopener">sick</a></span>
    <span class="footer-sep">·</span>
    <span>Powered by r3tard for r3tards</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
